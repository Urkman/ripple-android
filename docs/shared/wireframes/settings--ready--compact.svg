<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1470" viewBox="0 0 640 1470">
  <desc>Ripple Settings ready compact wireframe, surface contract 1.1.3.</desc>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#16333b}.muted{fill:#648087}.surface{fill:#fff;stroke:#a9c7cc;stroke-width:2}.accent{fill:#dceff2;stroke:#348b99;stroke-width:2}.danger{fill:#f4e6e7;stroke:#a96368;stroke-width:2}</style>
  <rect width="640" height="1470" fill="#f5fafb"/>
  <text x="40" y="50" font-size="16" class="muted">SHARED WIREFRAME · READY · COMPACT</text><text x="40" y="94" font-size="30" font-weight="700">Settings</text>
  <g font-size="16" font-weight="600" class="muted"><text x="40" y="142">Profile and unit</text><text x="40" y="286">Daily goal</text><text x="40" y="430">Containers</text><text x="40" y="664">Reminders</text><text x="40" y="808">Health</text><text x="40" y="952">Sync</text><text x="40" y="1096">Export</text><text x="40" y="1240">About</text></g>
  <rect x="40" y="160" width="560" height="96" rx="16" class="surface"/><text x="68" y="198" font-size="18">Preferred unit</text><text x="568" y="198" text-anchor="end" font-size="18" class="muted">ml</text><text x="68" y="232" font-size="16" class="muted">Profile · local preferences</text>
  <rect x="40" y="304" width="560" height="96" rx="16" class="surface"/><text x="68" y="342" font-size="18">Daily goal</text><text x="568" y="342" text-anchor="end" font-size="18" class="muted">2 000 ml</text><text x="68" y="376" font-size="16" class="muted">Manual or calculated</text>
  <rect x="40" y="448" width="560" height="188" rx="16" class="surface"/><text x="68" y="486" font-size="18">Containers</text><text x="568" y="486" text-anchor="end" font-size="16" class="muted">ordered</text><text x="68" y="528" font-size="17">Glas · 250 ml</text><text x="568" y="528" text-anchor="end" font-size="15" class="muted">default · edit</text><text x="68" y="570" font-size="17">Tasse · 200 ml</text><text x="568" y="570" text-anchor="end" font-size="15" class="muted">move · edit</text><text x="68" y="612" font-size="17">Flasche · 500 ml</text><text x="568" y="612" text-anchor="end" font-size="15" class="muted">move · edit</text>
  <rect x="40" y="682" width="560" height="96" rx="16" class="surface"/><text x="68" y="720" font-size="18">Reminders</text><text x="568" y="720" text-anchor="end" font-size="18" class="muted">Every 120 min</text><text x="68" y="754" font-size="16" class="muted">07:00–22:00 · enabled</text>
  <rect x="40" y="826" width="560" height="96" rx="16" class="surface"/><text x="68" y="864" font-size="18">Health</text><text x="568" y="864" text-anchor="end" font-size="16" class="muted">optional · denied</text><text x="68" y="898" font-size="16" class="muted">Request access without blocking logging</text>
  <rect x="40" y="970" width="560" height="96" rx="16" class="surface"/><text x="68" y="1008" font-size="18">Sync</text><text x="568" y="1008" text-anchor="end" font-size="16" class="muted">local ready</text><text x="68" y="1042" font-size="16" class="muted">Cloud freshness and recoverable status</text>
  <rect x="40" y="1114" width="560" height="96" rx="16" class="accent"/><text x="68" y="1152" font-size="18" font-weight="600">Export data</text><text x="568" y="1152" text-anchor="end" font-size="17">JSON / CSV</text><text x="68" y="1186" font-size="16" class="muted">Versioned share/save flow</text>
  <rect x="40" y="1258" width="560" height="96" rx="16" class="surface"/><text x="68" y="1296" font-size="18">About and support</text><text x="568" y="1296" text-anchor="end" font-size="16" class="muted">v1 · source · license</text><text x="68" y="1330" font-size="16" class="muted">Privacy and project links</text>
  <text x="40" y="1410" font-size="14" class="muted">Eight semantic groups remain distinct; native controls are platform-local.</text>
</svg>
