<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960">
  <desc>Ripple Today, ready compact wireframe, surface contract 1.2.3. The upright ready state shows a recognizable two-dimensional tumbler glass, a flat contained water surface, and the readout above the water. Device-tilt slosh is defined by the surface contract and is not represented as a second static state.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #16333b; }
    .muted { fill: #648087; }
    .accent { fill: #dceff2; stroke: #348b99; stroke-width: 2; }
    .glass { fill: #ffffff; fill-opacity: .42; stroke: #348b99; stroke-width: 3; stroke-linejoin: round; }
    .water { fill: #c5ebf0; fill-opacity: .94; }
    .waterline { fill: none; stroke: #5caab4; stroke-width: 2; }
    .reflection { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linecap: round; opacity: .48; }
  </style>
  <defs>
    <clipPath id="today-glass-inner">
      <path d="M151 198 Q320 170 489 198 L450 546 Q448 566 428 566 H212 Q192 566 190 546 Z"/>
    </clipPath>
  </defs>
  <rect width="640" height="960" fill="#f5fafb"/>
  <text x="40" y="48" font-size="16" class="muted">SHARED WIREFRAME · READY · COMPACT</text>
  <text x="40" y="88" font-size="30" font-weight="700">Ripple · Today</text>
  <text x="40" y="116" font-size="18" class="muted">Thursday, 17 September</text>

  <path d="M145 194 Q320 164 495 194 L456 548 Q454 570 430 572 H210 Q186 570 184 548 Z" class="glass"/>
  <g clip-path="url(#today-glass-inner)">
    <rect x="120" y="340" width="400" height="250" class="water"/>
    <path d="M130 340 H510" class="waterline"/>
    <path d="M456 214 L418 544" class="reflection"/>
  </g>
  <path d="M145 194 Q320 164 495 194 L456 548 Q454 570 430 572 H210 Q186 570 184 548 Z" fill="none" stroke="#348b99" stroke-width="3" stroke-linejoin="round"/>
  <text x="320" y="260" text-anchor="middle" font-size="44" font-weight="700">1 250 ml</text>
  <text x="320" y="294" text-anchor="middle" font-size="22" class="muted">62 % · Ziel 2 000 ml</text>
  <text x="320" y="488" text-anchor="middle" font-size="18" class="muted">2D tumbler glass · upright / idle</text>

  <text x="40" y="630" font-size="22" font-weight="600">Noch 750 ml</text>
  <text x="40" y="658" font-size="17" class="muted">remaining amount and goal status</text>
  <rect x="40" y="700" width="174" height="84" rx="16" class="accent"/>
  <rect x="233" y="700" width="174" height="84" rx="16" class="accent"/>
  <rect x="426" y="700" width="174" height="84" rx="16" class="accent"/>
  <text x="127" y="735" text-anchor="middle" font-size="19" font-weight="600">Glas</text><text x="127" y="764" text-anchor="middle" font-size="17">250 ml</text>
  <text x="320" y="735" text-anchor="middle" font-size="19" font-weight="600">Tasse</text><text x="320" y="764" text-anchor="middle" font-size="17">200 ml</text>
  <text x="513" y="735" text-anchor="middle" font-size="19" font-weight="600">Flasche</text><text x="513" y="764" text-anchor="middle" font-size="17">500 ml</text>
  <rect x="40" y="812" width="560" height="70" rx="14" fill="#ffffff" fill-opacity=".72" stroke="#a9c7cc" stroke-width="2"/>
  <text x="320" y="856" text-anchor="middle" font-size="20" font-weight="600">Benutzerdefinierte Menge</text>
</svg>
