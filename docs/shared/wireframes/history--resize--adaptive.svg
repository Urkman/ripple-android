<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#fff"/><g font-family="Arial, sans-serif" fill="#222"><text x="30" y="40" font-size="26">History — resize and usable fold regions</text><text x="30" y="70" font-size="16">Neutral shared wireframe • contract 1.2.1 • illustrative dimensions, not device pixels</text><text x="30" y="115" font-size="20">Compact / constrained height</text><text x="420" y="115" font-size="20">Expanded / active fold regions</text><rect x="30" y="135" width="330" height="390" rx="6" fill="#f4f4f4" stroke="#777"/><text x="44" y="165" font-size="18">Current safe content region</text><rect x="50" y="195" width="290" height="140" rx="6" fill="#f4f4f4" stroke="#777"/><text x="64" y="225" font-size="18">Month calendar</text><text x="65" y="260" font-size="16">One ring per day · month paging</text><rect x="50" y="370" width="290" height="75" rx="6" fill="#f4f4f4" stroke="#777"/><text x="64" y="400" font-size="18">Open selected day detail</text><text x="50" y="480" font-size="16">Vertical scroll for short windows</text><rect x="420" y="135" width="300" height="290" rx="6" fill="#f4f4f4" stroke="#777"/><text x="434" y="165" font-size="18">Calendar region</text><text x="440" y="225" font-size="18">Selected: 19 September</text><rect x="755" y="135" width="310" height="290" rx="6" fill="#f4f4f4" stroke="#777"/><text x="769" y="165" font-size="18">Selected day detail</text><text x="775" y="215" font-size="16">Same date / entries / actions</text><text x="420" y="465" font-size="17">Two columns only when calendar + divider + detail fit.</text><text x="420" y="505" font-size="16">Below the threshold: nested detail for the same selected day.</text><path d="M738 145 V415" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><text x="30" y="570" font-size="18">Preserve the selected root, current state, and any open custom-amount draft through reflow.</text><text x="30" y="605" font-size="16">Use system-provided usable regions; no inferred hardware inset. These are not runtime screenshots.</text></g></svg>