<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780">
  <desc>Ripple Custom amount sheet, ready compact wireframe, surface contract 1.1.2.</desc>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#16333b}.muted{fill:#648087}.surface{fill:#fff;stroke:#a9c7cc;stroke-width:2}.accent{fill:#dceff2;stroke:#348b99;stroke-width:2}.track{stroke:#7aa5ab;stroke-width:8;stroke-linecap:round}.thumb{fill:#348b99}</style>
  <rect width="640" height="780" fill="#eaf4f6"/>
  <rect x="24" y="24" width="592" height="732" rx="28" class="surface"/>
  <text x="54" y="72" font-size="18" class="muted">DISMISS</text><text x="320" y="75" text-anchor="middle" font-size="28" font-weight="700">Custom amount</text>
  <text x="320" y="168" text-anchor="middle" font-size="54" font-weight="700">420 ml</text>
  <line x1="84" y1="238" x2="556" y2="238" class="track"/><circle cx="332" cy="238" r="16" class="thumb"/>
  <text x="84" y="276" font-size="16" class="muted">50 ml</text><text x="556" y="276" text-anchor="end" font-size="16" class="muted">2 000 ml</text>
  <rect x="54" y="320" width="532" height="72" rx="14" class="accent"/><text x="320" y="365" text-anchor="middle" font-size="20" font-weight="600">Glas · 250 ml</text>
  <rect x="54" y="408" width="532" height="72" rx="14" class="surface"/><text x="320" y="453" text-anchor="middle" font-size="20">Tasse · 200 ml</text>
  <rect x="54" y="496" width="532" height="72" rx="14" class="surface"/><text x="320" y="541" text-anchor="middle" font-size="20">Flasche · 500 ml</text>
  <rect x="54" y="620" width="532" height="78" rx="16" class="accent"/><text x="320" y="670" text-anchor="middle" font-size="23" font-weight="700">Add 420 ml</text>
</svg>
