<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460">
  <desc>Ripple share and export semantic system handoff wireframe, surface contract 1.1.0.</desc>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#16333b}.muted{fill:#648087}.surface{fill:#fff;stroke:#a9c7cc;stroke-width:2}.accent{fill:#dceff2;stroke:#348b99;stroke-width:2}</style>
  <rect width="640" height="460" fill="#f5fafb"/><text x="40" y="48" font-size="16" class="muted">SYSTEM HANDOFF · READY · COMPACT</text><rect x="40" y="88" width="560" height="250" rx="22" class="surface"/><text x="72" y="134" font-size="22" font-weight="700">Export Ripple data</text><text x="72" y="174" font-size="17">Profile · goals · containers · reminders · intakes</text><text x="72" y="204" font-size="16" class="muted">Versioned JSON or CSV · soft-deleted state preserved as specified</text><rect x="72" y="246" width="220" height="54" rx="14" class="accent"/><text x="182" y="280" text-anchor="middle" font-size="18" font-weight="600">Prepare export</text><rect x="312" y="246" width="220" height="54" rx="14" class="surface"/><text x="422" y="280" text-anchor="middle" font-size="18">Cancel</text><text x="320" y="392" text-anchor="middle" font-size="15" class="muted">native save/share destination owns the final picker</text>
</svg>
