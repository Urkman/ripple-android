<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900">
  <desc>Ripple six-page onboarding ready compact wireframe, surface contract 1.1.0.</desc>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#16333b}.muted{fill:#648087}.surface{fill:#fff;stroke:#a9c7cc;stroke-width:2}.accent{fill:#dceff2;stroke:#348b99;stroke-width:2}.dot{fill:#348b99}</style>
  <rect width="640" height="900" fill="#f5fafb"/><text x="40" y="50" font-size="16" class="muted">SHARED WIREFRAME · READY · COMPACT · PAGE 6/6</text><rect x="40" y="94" width="560" height="612" rx="30" class="surface"/><circle cx="320" cy="220" r="84" class="accent"/><path d="M280 205 Q320 160 360 205 Q345 272 320 290 Q295 272 280 205Z" fill="#9ed9e1" stroke="#348b99" stroke-width="3"/><text x="320" y="360" text-anchor="middle" font-size="30" font-weight="700">Reminders</text><text x="320" y="402" text-anchor="middle" font-size="18" class="muted">A quiet prompt during your day</text><rect x="88" y="450" width="464" height="70" rx="14" class="accent"/><text x="320" y="494" text-anchor="middle" font-size="19" font-weight="600">Allow notifications (optional)</text><text x="320" y="570" text-anchor="middle" font-size="16" class="muted">Permission is explained before the system prompt.</text><text x="320" y="600" text-anchor="middle" font-size="16" class="muted">Local logging remains available if denied.</text><g><circle cx="268" cy="654" r="7" fill="#c6dadd"/><circle cx="294" cy="654" r="7" fill="#c6dadd"/><circle cx="320" cy="654" r="7" fill="#c6dadd"/><circle cx="346" cy="654" r="7" fill="#c6dadd"/><circle cx="372" cy="654" r="7" class="dot"/></g><rect x="40" y="758" width="270" height="68" rx="14" class="surface"/><text x="175" y="800" text-anchor="middle" font-size="20">Back</text><rect x="330" y="758" width="270" height="68" rx="14" class="accent"/><text x="465" y="800" text-anchor="middle" font-size="20" font-weight="700">Finish</text>
</svg>
