  <line x1="48" y1="594" x2="316" y2="594" stroke="#b9cbd0"/>
  <path d="M96 594 L180 544 L264 544" class="line"/><circle cx="96" cy="594" r="5" fill="#1a7a8c"/><circle cx="180" cy="544" r="5" fill="#1a7a8c"/><circle cx="264" cy="544" r="5" fill="#1a7a8c"/>
  <text x="96" y="614" text-anchor="middle" font-size="10" class="muted">Mon</text><text x="180" y="614" text-anchor="middle" font-size="10" class="muted">Tue</text><text x="264" y="614" text-anchor="middle" font-size="10" class="muted">Wed</text>
  <rect x="24" y="640" width="312" height="170" rx="16" class="surface"/>
  <text x="42" y="668" font-size="15" font-weight="700">Daypart distribution</text><text x="42" y="688" font-size="11" class="muted">Water by local time bucket · ml</text>
  <line x1="48" y1="780" x2="316" y2="780" stroke="#b9cbd0"/>
