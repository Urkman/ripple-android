  <text x="42" y="904" font-size="11">Glass</text><rect x="102" y="891" width="142" height="12" rx="6" class="bar"/><text x="264" y="902" font-size="10" class="muted">42%</text>
  <text x="42" y="934" font-size="11">Bottle</text><rect x="102" y="921" width="105" height="12" rx="6" class="bar"/><text x="264" y="932" font-size="10" class="muted">31%</text>
  <text x="42" y="964" font-size="11">Cup</text><rect x="102" y="951" width="61" height="12" rx="6" class="bar"/><text x="264" y="962" font-size="10" class="muted">18%</text>
  <text x="42" y="994" font-size="11">Other</text><rect x="102" y="981" width="31" height="12" rx="6" class="bar"/><text x="264" y="992" font-size="10" class="muted">9%</text>
  <rect x="24" y="1038" width="312" height="142" rx="16" class="surface"/>
  <text x="42" y="1066" font-size="15" font-weight="700">Highlights</text>
  <text x="42" y="1094" font-size="12">Best day · Wed · 2,250 ml</text><text x="42" y="1120" font-size="12">Weakest completed · Mon · 1,200 ml</text>
  <text x="42" y="1146" font-size="12">No-entry days · 0</text><text x="190" y="1146" font-size="12">Goal run · 2 days</text>
  <text x="180" y="1208" text-anchor="middle" font-size="11" class="muted">Illustrative complete scroll content · empty ranges show no chart marks</text>
  <line x1="20" y1="1228" x2="340" y2="1228" stroke="#cad7da"/>
  <text x="45" y="1250" text-anchor="middle" font-size="11" class="muted">Today</text><text x="135" y="1250" text-anchor="middle" font-size="11" class="muted">History</text><text x="225" y="1250" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a8c">Stats</text><text x="315" y="1250" text-anchor="middle" font-size="11" class="muted">Settings</text>
</svg>
