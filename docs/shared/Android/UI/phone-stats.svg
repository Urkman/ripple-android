<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260">
  <desc>Android compact Stats layout illustration with all four chart families. Not a runtime capture.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#16333b}.muted{fill:#617a80}.surface{fill:#fff;stroke:#b9cbd0;stroke-width:1.5}.accent{fill:#e4f2f4}.bar{fill:#4fb3c6}.line{fill:none;stroke:#1a7a8c;stroke-width:3}.goal{stroke:#1a7a8c;stroke-width:2;stroke-dasharray:5 4}</style>
  <rect width="360" height="1260" fill="#f5f8f9"/>
  <text x="24" y="42" font-size="13" font-weight="700">RIPPLE</text>
  <text x="24" y="78" font-size="27" font-weight="700">Stats</text>
  <rect x="24" y="98" width="312" height="48" rx="14" class="accent"/>
  <text x="76" y="128" text-anchor="middle" font-size="14" font-weight="700">Week</text><text x="180" y="128" text-anchor="middle" font-size="14">Month</text><text x="284" y="128" text-anchor="middle" font-size="14">Year</text>
  <text x="24" y="174" font-size="14" font-weight="600">‹</text><text x="52" y="174" font-size="14" class="muted">21–27 September 2026 · current ISO week</text><text x="328" y="174" text-anchor="end" font-size="14" font-weight="600">›</text>
  <rect x="24" y="192" width="98" height="82" rx="14" class="accent"/><rect x="131" y="192" width="98" height="82" rx="14" class="accent"/><rect x="238" y="192" width="98" height="82" rx="14" class="accent"/>
  <text x="73" y="219" text-anchor="middle" font-size="12" class="muted">Avg / day</text><text x="73" y="252" text-anchor="middle" font-size="18" font-weight="700">1,850 ml</text>
  <text x="180" y="219" text-anchor="middle" font-size="12" class="muted">Goal hit</text><text x="180" y="252" text-anchor="middle" font-size="18" font-weight="700">2 / 3</text>
  <text x="287" y="219" text-anchor="middle" font-size="12" class="muted">Total</text><text x="287" y="252" text-anchor="middle" font-size="18" font-weight="700">5,550 ml</text>
  <rect x="24" y="290" width="312" height="168" rx="16" class="surface"/>
  <text x="42" y="318" font-size="15" font-weight="700">Actual vs goal</text><text x="42" y="338" font-size="11" class="muted">Daily intake · ml</text>
  <line x1="48" y1="423" x2="316" y2="423" stroke="#b9cbd0"/>
  <line x1="48" y1="370" x2="316" y2="370" class="goal"/>
  <rect x="76" y="383" width="42" height="40" class="bar"/><rect x="160" y="359" width="42" height="64" class="bar"/><rect x="244" y="343" width="42" height="80" class="bar"/>
  <text x="97" y="444" text-anchor="middle" font-size="10" class="muted">Mon</text><text x="181" y="444" text-anchor="middle" font-size="10" class="muted">Tue</text><text x="265" y="444" text-anchor="middle" font-size="10" class="muted">Wed</text>
  <rect x="24" y="472" width="312" height="154" rx="16" class="surface"/>
