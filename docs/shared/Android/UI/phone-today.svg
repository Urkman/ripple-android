<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <desc>Android Today layout illustration. It is not a runtime capture. The upright ready state shows a recognizable two-dimensional tumbler glass with a flat contained water surface; device-tilt slosh is defined by the Android UI contract.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #16333b; }
    .muted { fill: #617a80; }
    .accent { fill: #e4f2f4; stroke: #348b99; stroke-width: 1.5; }
    .primary { fill: #1a7a8c; }
    .glass { fill: #ffffff; fill-opacity: .46; stroke: #348b99; stroke-width: 3; stroke-linejoin: round; }
    .water { fill: #9ed9e1; fill-opacity: .92; }
    .waterline { fill: none; stroke: #5caab4; stroke-width: 2; }
  </style>
  <defs>
    <clipPath id="phone-today-inner">
      <path d="M46 115 Q180 98 314 115 L286 360 Q284 378 269 380 H91 Q76 378 74 360 Z"/>
    </clipPath>
  </defs>
  <rect width="360" height="780" fill="#f5f8f9"/>
  <text x="28" y="34" font-size="13" font-weight="700">RIPPLE</text>
  <text x="28" y="59" font-size="17" font-weight="700">Today</text>
  <text x="28" y="78" font-size="12" class="muted">Wednesday · 23 September</text>

  <path d="M42 111 Q180 91 318 111 L288 361 Q286 381 270 383 H90 Q74 381 72 361 Z" class="glass"/>
  <g clip-path="url(#phone-today-inner)">
    <rect x="34" y="210" width="292" height="190" class="water"/>
    <path d="M34 210 H326" class="waterline"/>
  </g>
  <path d="M42 111 Q180 91 318 111 L288 361 Q286 381 270 383 H90 Q74 381 72 361 Z" fill="none" stroke="#348b99" stroke-width="3" stroke-linejoin="round"/>
  <text x="180" y="164" text-anchor="middle" font-size="33" font-weight="700">1,250 ml</text>
  <text x="180" y="190" text-anchor="middle" font-size="15" class="muted">Goal 2,000 ml · 62%</text>
  <text x="180" y="322" text-anchor="middle" font-size="14" font-weight="600">upright / idle glass</text>

  <text x="28" y="414" font-size="15" font-weight="700">750 ml remaining</text>
  <text x="28" y="433" font-size="12" class="muted">remaining amount and goal status</text>
  <text x="28" y="455" font-size="15" font-weight="700">Quick add</text>
  <rect x="28" y="466" width="96" height="58" rx="14" class="accent"/>
  <rect x="132" y="466" width="96" height="58" rx="14" class="accent"/>
  <rect x="236" y="466" width="96" height="58" rx="14" class="accent"/>
  <text x="76" y="490" text-anchor="middle" font-size="12">Glass</text><text x="76" y="511" text-anchor="middle" font-size="14" font-weight="700">250 ml</text>
  <text x="180" y="490" text-anchor="middle" font-size="12">Cup</text><text x="180" y="511" text-anchor="middle" font-size="14" font-weight="700">200 ml</text>
  <text x="284" y="490" text-anchor="middle" font-size="12">Bottle</text><text x="284" y="511" text-anchor="middle" font-size="14" font-weight="700">500 ml</text>
  <rect x="28" y="538" width="304" height="54" rx="14" class="primary"/>
  <text x="180" y="572" text-anchor="middle" font-size="16" font-weight="700" style="fill:#fff">Custom amount</text>
  <text x="180" y="615" text-anchor="middle" font-size="12" class="muted">Success feedback overlays actions; no layout shift</text>
  <line x1="20" y1="646" x2="340" y2="646" stroke="#cad7da" stroke-width="1"/>
  <text x="45" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7a8c">Today</text>
  <text x="135" y="678" text-anchor="middle" font-size="12" class="muted">History</text>
  <text x="225" y="678" text-anchor="middle" font-size="12" class="muted">Stats</text>
  <text x="315" y="678" text-anchor="middle" font-size="12" class="muted">Settings</text>
  <text x="28" y="724" font-size="11" class="muted">Illustrative Android layout · no Recent list</text>
</svg>
