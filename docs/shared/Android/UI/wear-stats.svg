<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <desc>Android Wear current ISO-week Stats illustration with average, goal hits, total, and one chart. Not a runtime capture.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#f2fbfc}.muted{fill:#b4c9cd}.row{fill:#1a3036}.bar{fill:#5caab4}</style>
  <rect width="360" height="360" rx="54" fill="#0f1b1f"/>
  <text x="24" y="34" font-size="12" class="muted">STATS</text>
  <text x="24" y="61" font-size="18" font-weight="700">Current ISO week</text>
  <text x="24" y="80" font-size="11" class="muted">21–27 Sep 2026 · 3 elapsed days</text>
  <rect x="18" y="94" width="104" height="56" rx="12" class="row"/><rect x="128" y="94" width="104" height="56" rx="12" class="row"/><rect x="238" y="94" width="104" height="56" rx="12" class="row"/>
  <text x="70" y="115" text-anchor="middle" font-size="10" class="muted">Average / day</text><text x="70" y="139" text-anchor="middle" font-size="16" font-weight="700">1,850 ml</text>
  <text x="180" y="115" text-anchor="middle" font-size="10" class="muted">Goal hits</text><text x="180" y="139" text-anchor="middle" font-size="16" font-weight="700">2 / 3</text>
  <text x="290" y="115" text-anchor="middle" font-size="10" class="muted">Total</text><text x="290" y="139" text-anchor="middle" font-size="16" font-weight="700">5,550 ml</text>
  <rect x="18" y="162" width="324" height="150" rx="15" class="row"/>
  <text x="36" y="187" font-size="13" font-weight="700">Daily intake</text>
  <line x1="38" y1="276" x2="322" y2="276" stroke="#5caab4" stroke-width="1.5"/>
  <rect x="72" y="242" width="42" height="34" class="bar"/><rect x="158" y="216" width="42" height="60" class="bar"/><rect x="244" y="208" width="42" height="68" class="bar"/>
  <text x="93" y="294" text-anchor="middle" font-size="9" class="muted">Mon</text><text x="179" y="294" text-anchor="middle" font-size="9" class="muted">Tue</text><text x="265" y="294" text-anchor="middle" font-size="9" class="muted">Wed</text>
  <text x="180" y="337" text-anchor="middle" font-size="10" class="muted">One compact chart · text summary available</text>
</svg>
